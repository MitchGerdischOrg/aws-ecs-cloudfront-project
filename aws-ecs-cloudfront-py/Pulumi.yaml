name: mrg-ecs-cloudfront-project
description: ECR + ECS container fronted by CloudFront
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
packages:
  # Without a version, the latest version of the component will be used
  container-services-py: https://github.com/MitchellGerdisch/aws-ecs-cloudfront-project/component-aws-container-services-py
  # if versioning the component use this sort of nomenclature:
  # container-services-py: https://github.com/MitchellGerdisch/component-aws-container-services-py@v1.0.0
