name: mrg-ecs-cloudfront-project
description: ECR + ECS container fronted by CloudFront
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
packages:
  # Without a version, the latest version of the component will be used
  container-services-py: github.com/MitchellGerdisch/aws-ecs-cloudfront-project/component-container-services-py
  # if versioning the component use this sort of nomenclature:
  # container-services-py: github.com/MitchellGerdisch/aws-ecs-cloudfront-project/component-container-services-py@vX.Y.Z
  # e.g. 
  # container-services-py: github.com/MitchellGerdisch/aws-ecs-cloudfront-project/component-container-services-py@v1.0.0
